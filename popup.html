<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Translate Page</title>
    <style>
      :root {
        --bg-color: #121212;
        --card-bg: #1e1e1e;
        --card-border: #27272a;
        --text-primary: #f4f4f5;
        --text-secondary: #a1a1aa;
        --text-muted: #71717a;
        --accent-pink: #f43f5e;
        --banner-bg: linear-gradient(135deg, #fdf2f8, #fce7f3);
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        width: 340px;
        margin: 0;
        padding: 16px;
        background-color: var(--bg-color);
        color: var(--text-primary);
        box-sizing: border-box;
      }

      /* Top Bar */
      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        font-size: 13px;
      }
      .user-info {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text-secondary);
      }
      .avatar {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--accent-pink);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        color: white;
        font-size: 10px;
      }
      .pro-status {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--accent-pink);
        font-weight: 500;
      }
      .toggle-switch {
        width: 32px;
        height: 18px;
        background: #3f3f46;
        border-radius: 9px;
        position: relative;
        cursor: pointer;
        transition: background 0.3s;
      }
      .toggle-switch::after {
        content: '';
        position: absolute;
        width: 14px;
        height: 14px;
        background: #f4f4f5;
        border-radius: 50%;
        top: 2px;
        left: 2px;
        transition: left 0.3s;
      }
      .toggle-switch.active {
        background: var(--accent-pink);
      }
      .toggle-switch.active::after {
        left: 16px;
      }

      /* Banner */
      .banner {
        background: var(--banner-bg);
        border-radius: 12px;
        padding: 12px;
        text-align: center;
        margin-bottom: 16px;
        position: relative;
      }
      .banner-title {
        color: #be123c;
        font-weight: 600;
        font-size: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-bottom: 4px;
      }
      .banner-subtitle {
        color: var(--accent-pink);
        font-weight: 700;
        font-size: 14px;
      }

      /* Language Row */
      .lang-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }
      .lang-select {
        flex: 1;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 13px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .lang-arrow {
        padding: 0 12px;
        color: var(--text-muted);
        font-size: 16px;
      }

      /* Settings Box */
      .settings-box {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 16px;
      }
      .settings-row {
        display: flex;
        align-items: center;
        font-size: 13px;
        margin-bottom: 12px;
      }
      .settings-row:last-child {
        margin-bottom: 0;
      }
      .settings-label {
        color: var(--text-secondary);
        width: 70px;
      }
      .settings-input {
        flex: 1;
        background: transparent;
        border: none;
        color: var(--text-primary);
        font-size: 13px;
        outline: none;
        padding: 4px 0;
        border-bottom: 1px solid #3f3f46;
      }
      .settings-input:focus {
        border-bottom-color: var(--accent-pink);
      }

      /* Main Action */
      .main-action {
        display: flex;
        gap: 12px;
        margin-bottom: 16px;
      }
      .icon-btn {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        width: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-secondary);
        cursor: pointer;
      }
      .icon-btn:hover {
        background: #27272a;
      }
      .translate-btn {
        flex: 1;
        background: var(--accent-pink);
        color: white;
        border: none;
        border-radius: 12px;
        padding: 14px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      .translate-btn:hover {
        opacity: 0.9;
      }

      /* Grid Actions */
      .grid-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 16px;
      }
      .grid-btn {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 10px;
        padding: 12px;
        color: var(--text-primary);
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        justify-content: flex-start;
      }
      .grid-btn:hover {
        background: #27272a;
      }
      .grid-btn svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
        color: var(--text-secondary);
      }
      
      /* Status */
      #status {
        font-size: 12px;
        color: var(--text-secondary);
        text-align: center;
        margin-bottom: 16px;
        min-height: 16px;
      }

      /* Footer */
      .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        color: var(--text-muted);
        padding-top: 8px;
      }
      .footer-btn {
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
      }
      .footer-btn:hover {
        color: var(--text-secondary);
      }
    </style>
  </head>
  <body>
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="user-info">
        <img src="icon48.png" alt="Logo" style="width: 24px; height: 24px; border-radius: 6px;" />
        <span style="font-weight: 600; color: var(--text-primary);">TranslatePage</span>
      </div>
    </div>

    <!-- Language Row -->
    <div class="lang-row">
      <div class="lang-select">
        English (Auto)
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="lang-arrow">→</div>
      <div class="lang-select">
        Vietnamese...
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </div>
    </div>

    <!-- Settings Box -->
    <div class="settings-box">
      <div class="settings-row">
        <span class="settings-label">API Key</span>
        <input type="password" id="apiKey" class="settings-input" placeholder="Nhập Gemini API Key" />
      </div>
      <div class="settings-row" style="margin-top: 12px; justify-content: space-between;">
        <span class="settings-label" style="width: auto; color: var(--text-primary)">Hiển thị bản gốc (Song ngữ)</span>
        <div id="bilingualToggle" class="toggle-switch"></div>
      </div>
    </div>

    <!-- Main Action -->
    <div class="main-action">
      <div class="icon-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
      </div>
      <button id="translateBtn" class="translate-btn">Translate (Alt+A)</button>
    </div>

    <!-- Grid Actions -->
    <div class="grid-actions">
      <button class="grid-btn" id="removeBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        Khôi phục gốc
      </button>
      <button class="grid-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
        Text
      </button>
      <button class="grid-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12A10 10 0 1 1 12 2a10 10 0 0 1 10 10zM12 16v-4M12 8h.01"/></svg>
        Hover
      </button>
      <button class="grid-btn" id="selectionBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 3v6a2 2 0 0 1-2 2h-6"/><path d="M3 21v-6a2 2 0 0 1 2-2h6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
        Selection...
      </button>
    </div>

    <div id="status"></div>

    <!-- Footer -->
    <div class="footer">
      <div class="footer-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        Settings
      </div>
      <div>V 1.30.1</div>
      <div class="footer-btn">More Features</div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
